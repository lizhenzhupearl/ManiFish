[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manifish"
version = "0.1.0"
description = "Unified Manifold Framework for Cross-MLIP Materials Discovery"
readme = "README.md"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = ["materials", "machine-learning", "mlip", "crystal-structure", "manifold-learning"]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "scikit-learn>=1.0.0",
    "pandas>=1.3.0",
    "ase>=3.22.0",
    "pymatgen>=2023.0.0",
    "torch>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.950",
    "sphinx>=4.5",
]
mlip = [
    "chgnet>=0.3.0",
    "mace-torch>=0.3.0",
    "matgl>=0.9.0",  # M3GNet
]
viz = [
    "plotly>=5.0",
    "seaborn>=0.11",
    "umap-learn>=0.5",
]

[project.urls]
Homepage = "https://github.com/lizhenzhupearl/ManiFish"
Documentation = "https://lizhenzhupearl.github.io/ManiFish"
Repository = "https://github.com/lizhenzhupearl/ManiFish"
Issues = "https://github.com/lizhenzhupearl/ManiFish/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["manifish*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=manifish --cov-report=html --cov-report=term"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
